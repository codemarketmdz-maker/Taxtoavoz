name: Compilar APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir
        run: unzip -q texto-a-voz.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        run: gradle -p texto-a-voz assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TextoAVoz-apk
          path: texto-a-voz/app/build/outputs/apk/debug/app-debug.apk
